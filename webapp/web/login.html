<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Bot Teknisi</title><style>body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#0f172a;color:#fff;display:grid;place-items:center}.card{width:min(390px,calc(100% - 32px));background:#fff;color:#172033;border-radius:24px;padding:28px;box-sizing:border-box}.brand{font-size:24px;font-weight:800;margin-bottom:6px}.sub{color:#64748b;margin-bottom:24px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;font-size:16px}.err{min-height:20px;color:#dc2626;font-size:13px;margin-top:10px}</style></head><body><main class="card"><div class="brand">BOT TEKNISI</div><div class="sub">Masuk untuk membuka dashboard.</div><form id="f"><label>NIK / Username</label><input id="nik" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Masuk</button><div class="err" id="err"></div></form></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),x=document.getElementById('err');b.disabled=true;x.textContent='';try{const r=await fetch('/api/web-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nik:nik.value,password:password.value})});const d=await r.json();if(!d.ok)throw Error(d.message||'Login gagal');location.replace('/web/')}catch(e){x.textContent=e.message||'Login gagal';b.disabled=false}};</script></body></html>
