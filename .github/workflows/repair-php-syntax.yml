name: Repair PHP syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed PHP expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('webapp/php_backend.php')
          s = p.read_text(encoding='utf-8')
          old = "$rawNik=trim((string)$r['nik'];"
          new = "$rawNik=trim((string)$r['nik']);"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Validate PHP
        run: php -l webapp/php_backend.php
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp/php_backend.php
          git diff --cached --quiet || git commit -m 'fix: repair PHP syntax blocking reports'
          git push
